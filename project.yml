name: CollegeFootballSchedule
options:
  bundleIdPrefix: com.bobbynicoloulias
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "13"
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc ("Sign to Run Locally") so the project builds and runs without a
    # provisioning profile. That covers the Mac and the iOS Simulator; a real
    # iPhone won't install ad-hoc builds, so the targets switch to automatic
    # signing for the iphoneos SDK only, with the team from
    # Config/Local.xcconfig.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  CollegeFootballSchedule:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CFB Schedule Widget
        # Follow the build settings, so bumping CURRENT_PROJECT_VERSION really
        # changes the bundle. WidgetKit's chronod caches a widget's descriptor
        # keyed on this version and will not re-read the extension until it
        # changes -- a stale name or configuration in the widget gallery is the
        # symptom.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        NSHumanReadableCopyright: ""
        # iOS refuses to launch an app without a launch screen; an empty
        # dictionary asks for the plain system one. macOS ignores these.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/CollegeFootballSchedule.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobbynicoloulias.CollegeFootballSchedule
        PRODUCT_NAME: CollegeFootballSchedule
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        # The sandbox keys are macOS-only; iOS apps are always sandboxed, and
        # a provisioning profile would reject them.
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ""
        # XcodeGen's iOS preset sets "iPhone Developer" per target, which
        # would override the ad-hoc identity above on macOS too.
        CODE_SIGN_IDENTITY: "-"
        # Device builds only; these must sit at target level to beat the
        # unconditional identity above.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        DEVELOPMENT_TEAM[sdk=iphoneos*]: $(DEVELOPMENT_TEAM_ID)
    dependencies:
      - target: CollegeFootballScheduleWidget
        embed: true
      # Linked explicitly: the metadata extractor skips targets that only
      # autolink AppIntents, and iOS then has no default SelectTeamIntent, so
      # the widget never gets past its placeholder.
      - sdk: AppIntents.framework

  CollegeFootballScheduleWidget:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: CFB Schedule Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CollegeFootballScheduleWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobbynicoloulias.CollegeFootballSchedule.Widget
        PRODUCT_NAME: CollegeFootballScheduleWidget
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        DEVELOPMENT_TEAM[sdk=iphoneos*]: $(DEVELOPMENT_TEAM_ID)
    dependencies:
      - sdk: AppIntents.framework

  CollegeFootballScheduleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobbynicoloulias.CollegeFootballScheduleTests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives the iOS-style host path now that the app is
        # multiplatform; the tests run on macOS, where the binary is nested.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CollegeFootballSchedule.app/Contents/MacOS/CollegeFootballSchedule
    dependencies:
      - target: CollegeFootballSchedule

schemes:
  CollegeFootballSchedule:
    build:
      targets:
        CollegeFootballSchedule: all
        CollegeFootballScheduleWidget: all
        CollegeFootballScheduleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CollegeFootballScheduleTests

  # Run this scheme to attach Xcode to the widget extension, which is the only
  # way `print` from the provider reaches a console -- chronod launches the
  # extension normally, so its stdout goes nowhere. Xcode asks which app to run
  # it in; pick CollegeFootballSchedule.
  CollegeFootballScheduleWidget:
    build:
      targets:
        CollegeFootballScheduleWidget: all
    run:
      config: Debug
